include:
  - local: ".gitlab-release.yml"
## ============================================================================================
stages:
  - build
  - release

default:
  # All jobs are interruptible by default
  interruptible: true

## ============================================================================================
variables:
  PIPELINE_NAME: "Default pipeline name"
  GIT_DEPTH: 3
  SCCACHE_CONF: "/etc/sccache/sccache.toml"
  SCCACHE_DIR: "/var/cache/sccache/"
  SCCACHE_BASEDIRS: "$CI_PROJECT_DIR"
# gitlab runner volumes
# volumes = ["/etc/sccache/sccache.toml:/etc/sccache/sccache.toml:ro","/var/cache/sccache/:/var/cache/sccache/:rw","/cache"]

## ============================================================================================
workflow:
  name: "$PIPELINE_NAME"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+\.\d+$/'
      variables:
        PIPELINE_NAME: "Release tag pipeline"
    - when: never

## ============================================================================================
.build-test:rules:
  rules:
    - if: "$CI_COMMIT_TAG =~ /^v/"
      when: on_success
    - when: never

.default-retry:
  retry:
    max: 1
    when:
      - api_failure
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure

## --------------------------------------------------------------------------------------------
ai_review:
  stage: build
  image:
    name: debian-12-codex:latest
    entrypoint: [""]
  tags:
    - Linux
  timeout: 5m
  allow_failure: true
  interruptible: true
  resource_group: "ai-review-${CI_MERGE_REQUEST_IID}"
  variables:
    # The target branch must be available even when the project-wide clone is shallow.
    GIT_DEPTH: "0"
    CODEX_HOME: "$CI_PROJECT_DIR/.codex-ci"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_success
    - when: never
  before_script:
    - |
      set -eu
      export OPENAI_API_KEY="${OPENAI_API_KEY:-${OPENAI_API_KEY:-}}"
      test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is not set" >&2; exit 1; }
      test -n "${OPENAI_PROXY:-}" || { echo "OPENAI_PROXY is not set" >&2; exit 1; }
      test -n "${GITLAB_CI_TOKEN:-}" || { echo "GITLAB_CI_TOKEN is not set" >&2; exit 1; }
      mkdir -p "$CODEX_HOME/skills"
      cp -R .agents/skills/cpp-merge-request-review "$CODEX_HOME/skills/"
      printf '%s' "$OPENAI_API_KEY" | codex login --with-api-key
      git fetch --no-tags origin \
        "+refs/heads/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}:refs/remotes/origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
  script:
    - |
      codex exec \
        --model gpt-5.6-sol \
        --config "openai_base_url=${OPENAI_PROXY}" \
        --config 'model_reasoning_effort="medium"' \
        --sandbox danger-full-access \
        --ephemeral \
        --ignore-user-config \
        --color never \
        --output-last-message codex-review.md \
        review \
        --base "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}" \
        --title "${CI_MERGE_REQUEST_TITLE}"
      test -s codex-review.md

      MR_API="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}"
      REVIEW_MARKER='<!-- codex-ai-review -->'

      # Do not let an obsolete pipeline overwrite the review for a newer MR head.
      curl --fail-with-body --silent --show-error \
        --header "PRIVATE-TOKEN: ${GITLAB_CI_TOKEN}" \
        --output "$CODEX_HOME/merge-request.json" \
        "$MR_API"
      CURRENT_HEAD_SHA="$(jq -r '.sha // .diff_refs.head_sha' "$CODEX_HOME/merge-request.json")"
      if [ "$CURRENT_HEAD_SHA" != "$CI_COMMIT_SHA" ]; then
        echo "Skipping MR comment: reviewed ${CI_COMMIT_SHA}, current head is ${CURRENT_HEAD_SHA}."
        exit 0
      fi

      {
        printf '%s\n\n' "$REVIEW_MARKER"
        printf '## Codex AI review\n\n'
        printf '_Reviewed commit [`%.12s`](%s/-/commit/%s) in [pipeline %s](%s)._\n\n' \
          "$CI_COMMIT_SHA" "$CI_PROJECT_URL" "$CI_COMMIT_SHA" "$CI_PIPELINE_ID" "$CI_PIPELINE_URL"
        cat codex-review.md
      } > codex-review-note.md

      # Restrict marker matching to notes owned by the API token's user.
      curl --fail-with-body --silent --show-error \
        --header "PRIVATE-TOKEN: ${GITLAB_CI_TOKEN}" \
        --output "$CODEX_HOME/api-user.json" \
        "${CI_API_V4_URL}/user"
      REVIEW_AUTHOR_ID="$(jq -r '.id' "$CODEX_HOME/api-user.json")"

      NOTE_ID=""
      PAGE=1
      while [ -z "$NOTE_ID" ]; do
        curl --fail-with-body --silent --show-error \
          --header "PRIVATE-TOKEN: ${GITLAB_CI_TOKEN}" \
          --output "$CODEX_HOME/notes.json" \
          "${MR_API}/notes?per_page=100&page=${PAGE}&order_by=updated_at&sort=desc"
        NOTE_ID="$(jq -r \
          --arg marker "$REVIEW_MARKER" \
          --argjson author_id "$REVIEW_AUTHOR_ID" \
          '[.[] | select(.author.id == $author_id and (.body | contains($marker)))][0].id // empty' \
          "$CODEX_HOME/notes.json")"
        NOTE_COUNT="$(jq 'length' "$CODEX_HOME/notes.json")"
        if [ -n "$NOTE_ID" ] || [ "$NOTE_COUNT" -lt 100 ]; then
          break
        fi
        PAGE=$((PAGE + 1))
      done

      if [ -n "$NOTE_ID" ]; then
        echo "Updating Codex review note ${NOTE_ID}."
        curl --fail-with-body --silent --show-error \
          --request PUT \
          --header "PRIVATE-TOKEN: ${GITLAB_CI_TOKEN}" \
          --data-urlencode "body@codex-review-note.md" \
          --output "$CODEX_HOME/note-response.json" \
          "${MR_API}/notes/${NOTE_ID}"
      else
        echo "Creating the initial Codex review note."
        curl --fail-with-body --silent --show-error \
          --request POST \
          --header "PRIVATE-TOKEN: ${GITLAB_CI_TOKEN}" \
          --data-urlencode "body@codex-review-note.md" \
          --output "$CODEX_HOME/note-response.json" \
          "${MR_API}/notes"
      fi

build_amd64:
  extends:
    - .build-test:rules
    - .default-retry
  stage: build
  image:
    name: debian-12-base:latest
    entrypoint: [""]
  timeout: 5m
  interruptible: true
  tags:
    - Linux
  script:
    - |
      echo "=========== ${CI_PROJECT_DIR} =========== "
      git submodule update --init --recursive --force --depth 1
      cmake . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      cmake --build build -j$(nproc)
      sccache --show-stats

build_android:
  extends:
    - .build-test:rules
    - .default-retry
  stage: build
  image:
    name: debian-12-base:latest
    entrypoint: [""]
  timeout: 5m
  interruptible: true
  tags:
    - Linux
  script:
    - |
      git submodule update --init --recursive --depth 1
      gradle --version && gradle -p android :base:assembleRelease -Pall=true
      sccache --show-stats
