.default-retry:
  retry:
    max: 1
    when:
      - api_failure
      - runner_system_failure
      - stuck_or_timeout_failure
      - unknown_failure

build_all:
  extends:
    - .default-retry
  stage: release
  image:
    name: debian-12-base:latest
    entrypoint: [""]
  timeout: 10m
  interruptible: true
  variables:
    GIT_DEPTH: 0
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+\.\d+$/'
      when: on_success
    - when: never
  tags:
    - Linux
  script:
    - |
      echo "=========== ${CI_PROJECT_DIR} =========== "
